name = "after-office"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "../public"
binding = "ASSETS"
# Without this, Cloudflare serves any request matching a real file straight
# from the static-assets layer and never invokes fetch() below — meaning the
# security headers/CSP added there (for /admin and the public site alike)
# silently never applied to actual page loads, only to the handful of routes
# that aren't real files (/api/*, /js/menu-data.js, etc).
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "after-office-db"
database_id = "113907fe-2a31-4f07-8ae5-de6ab47a5bd5"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "3313b0392cc74d289c9fff33c7f77159"

[[kv_namespaces]]
binding = "IMAGES_KV"
id = "6e3dfbbe9a234e64bfe1bcec503f33fd"

[triggers]
crons = ["0 6 * * *"]
