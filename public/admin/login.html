<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · Admin After Office</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23d946ef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0f'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='Arial Black, Arial, sans-serif' font-size='17' font-weight='900' fill='url(%23g)'%3EAO%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-card__inner">
        <div class="login-brand">
          <div class="admin-wordmark admin-wordmark--login" aria-label="After Office Futrono" translate="no">
            <span class="admin-wordmark__name">After Office</span>
            <span class="admin-wordmark__city">Futrono</span>
          </div>
          <p class="login-brand__eyebrow">Panel privado</p>
          <h1 class="login-brand__title">Administración</h1>
        </div>

        <form id="login-form" novalidate>
          <div class="login-field">
            <label for="username">Usuario</label>
            <div class="login-field__control">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
          </div>
          <div class="login-field">
            <label for="password">Contraseña</label>
            <div class="login-field__control">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="password" name="password" autocomplete="current-password" required>
              <button type="button" class="login-field__toggle" data-toggle-password="password" aria-label="Mostrar contraseña" tabindex="-1">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M6.1 6.1C3.51 7.86 1 12 1 12s4 8 11 8a9.26 9.26 0 0 0 5.9-2.1"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn--primary btn--block login-submit" id="login-submit">
            <span id="login-submit-label">Ingresar</span>
          </button>
          <p class="login-error" id="login-error" role="alert"></p>
        </form>

        <p class="login-footer">After Office Resto-Bar · Futrono</p>
        <p class="admin-footer__credit">Desarrollado por <a href="https://www.adkiniq.cl" target="_blank" rel="noopener noreferrer"><img class="admin-footer__logo" src="../imagenes_sitio/adkiniq-logo.webp" alt="Adkiniq" width="887" height="224"></a></p>
      </div>
    </div>
  </div>
  <script src="./login.js"></script>
</body>
</html>
